<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziennik Elektroniczny - Lekcje i Kalendarz</title>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #333333;
      --border-color: #e0e0e0;
      
      --color-admin: #6c5ce7;
      --color-teacher: #0984e3;
      --color-student: #00b894;
      --role-current: #0984e3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .auth-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #636e72;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background-color: var(--role-current);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .app-header {
      background-color: var(--role-current);
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .dashboard-layout {
      display: flex;
      flex: 1;
    }

    .sidebar {
      width: 240px;
      background: var(--card-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px 0;
    }

    .sidebar-menu { list-style: none; }
    .sidebar-menu li a {
      display: block;
      padding: 12px 25px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      border-left: 4px solid transparent;
    }

    .sidebar-menu li a:hover, .sidebar-menu li a.active {
      background: #f0f4f8;
      border-left-color: var(--role-current);
      color: var(--role-current);
    }

    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Kalendarz Tygodniowy */
    .week-calendar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .day-card {
      background: #f8f9fa;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-card.active {
      background: var(--role-current);
      color: white;
      border-color: var(--role-current);
    }

    /* Lista lekcji */
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lesson-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--card-bg);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .lesson-item:hover {
      border-color: var(--role-current);
    }

    /* Taby lekcji (Frekwencja, Oceny, Uwagi, Terminarz) */
    .lesson-tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-btn.active {
      border-bottom-color: var(--role-current);
      color: var(--role-current);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }

    th { background-color: #f8f9fa; }
    .hidden { display: none !important; }
    .form-inline { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }

    body.theme-admin { --role-current: var(--color-admin); }
    body.theme-teacher { --role-current: var(--color-teacher); }
    body.theme-student { --role-current: var(--color-student); }
  </style>
</head>
<body>

  <!-- EKRAN LOGOWANIA -->
  <div id="auth-section" class="auth-container">
    <h2>Dziennik Elektroniczny</h2>
    <div id="auth-error" style="color: red; margin-bottom: 10px; font-size: 0.9rem;"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required placeholder="wprowadz email">
      </div>
      <div class="form-group">
        <label>Haslo</label>
        <input type="password" id="login-password" required placeholder="wprowadz haslo">
      </div>
      <button type="submit" class="btn">Zaloguj sie</button>
    </form>
  </div>

  <!-- APLIKACJA GLOWNA -->
  <div id="app-section" class="hidden">
    <header class="app-header">
      <h2>Dziennik Elektroniczny</h2>
      <div>
        <span id="user-display-name">Uzytkownik</span>
        <span id="user-role-badge" class="role-badge">Rola</span>
        <button id="btn-logout" class="btn-logout">Wyloguj</button>
      </div>
    </header>

    <div class="dashboard-layout">
      <nav class="sidebar">
        <ul class="sidebar-menu" id="sidebar-menu"></ul>
      </nav>
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { initializeFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdUEJhYVoWFKeAFo0EmvyR3hqTmGz3cBw",
      authDomain: "nowydzienniczek.firebaseapp.com",
      projectId: "nowydzienniczek",
      storageBucket: "nowydzienniczek.firebasestorage.app",
      messagingSenderId: "626017005986",
      appId: "1:626017005986:web:1aee804fac7f3fe08f02fb",
      measurementId: "G-PZXJ7K76MX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { experimentalForceLongPolling: false });

    let currentUserData = null;
    let selectedClassId = null;
    let selectedDay = "Poniedzialek";
    let selectedLesson = null;

    const daysOfWeek = ["Poniedzialek", "Wtorek", "Sroda", "Czwartek", "Piatek"];

    // LOGOWANIE
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
      } catch (err) {
        document.getElementById('auth-error').textContent = 'Blad logowania: ' + err.message;
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const userDocSnap = await getDoc(doc(db, "users", user.uid));
          if (userDocSnap.exists()) {
            currentUserData = { uid: user.uid, ...userDocSnap.data() };
            setupDashboard();
          } else {
            alert("Brak profilu uzytkownika w bazie Firestore!");
            signOut(auth);
          }
        } catch (err) { alert("Blad bazy: " + err.message); }
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
      }
    });

    function setupDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('user-display-name').textContent = `${currentUserData.name || ''} ${currentUserData.surname || ''}`;
      
      const roles = Array.isArray(currentUserData.role) ? currentUserData.role : [currentUserData.role];
      document.getElementById('user-role-badge').textContent = roles.join(' / ');
      document.body.className = `theme-${roles[0]}`;

      const menu = document.getElementById('sidebar-menu');
      menu.innerHTML = '';

      if (roles.includes('admin')) {
        menu.innerHTML += `<li><a href="#" data-view="admin-setup" class="active">Struktura i Klasy</a></li>`;
      }
      if (roles.includes('teacher') || roles.includes('student')) {
        menu.innerHTML += `<li><a href="#" data-view="journal-view" class="active">Dziennik Lekcyjny</a></li>`;
        menu.innerHTML += `<li><a href="#" data-view="announcements-view">Ogloszenia</a></li>`;
      }

      menu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          menu.querySelectorAll('a').forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          loadView(link.dataset.view);
        });
      });

      loadView(menu.querySelector('a')?.dataset.view);
    }

    async function loadView(viewName) {
      const main = document.getElementById('main-content');
      main.innerHTML = '<p>Ladowanie...</p>';

      try {
        if (viewName === 'admin-setup') await renderAdminSetup(main);
        else if (viewName === 'journal-view') await renderJournalView(main);
        else if (viewName === 'announcements-view') await renderAnnouncements(main);
      } catch (err) {
        main.innerHTML = `<div class="card" style="color:red"><h3>Blad:</h3><p>${err.message}</p></div>`;
      }
    }

// --- ADMIN: KONFIGURACJA KLAS, LEKCJI I PRZYPISYWANIE UCZNIOW ---
async function renderAdminSetup(container) {
  const classesSnap = await getDocs(collection(db, "classes"));
  let classOptions = '';
  classesSnap.forEach(c => classOptions += `<option value="${c.id}">${c.data().name}</option>`);

  // Pobranie uzytkownikow z rola student
  const studentsSnap = await getDocs(query(collection(db, "users"), where("role", "==", "student")));
  let studentOptions = '';
  studentsSnap.forEach(s => {
    const data = s.data();
    studentOptions += `<option value="${s.id}">${data.name || ''} ${data.surname || ''} (${s.id})</option>`;
  });

  container.innerHTML = `
    <div class="card">
      <h3>1. Tworzenie nowej klasy</h3>
      <form id="form-add-class" class="form-inline">
        <input type="text" id="class-name" placeholder="Nazwa klasy (np. 1A)" required>
        <button type="submit" class="btn">Dodaj klase</button>
      </form>
    </div>

    <div class="card">
      <h3>2. Przypisz ucznia do klasy</h3>
      <form id="form-assign-student" class="form-inline">
        <select id="as-student" required><option value="">Wybierz ucznia...</option>${studentOptions}</select>
        <select id="as-class" required><option value="">Wybierz klase...</option>${classOptions}</select>
        <button type="submit" class="btn">Przypisz do klasy</button>
      </form>
    </div>

    <div class="card">
      <h3>3. Dodawanie lekcji do planu zajec</h3>
      <form id="form-add-timetable" class="form-inline">
        <select id="tt-class" required><option value="">Wybierz klase...</option>${classOptions}</select>
        <select id="tt-day" required>
          ${daysOfWeek.map(d => `<option value="${d}">${d}</option>`).join('')}
        </select>
        <input type="number" id="tt-num" placeholder="Nr lekcji (1-8)" min="1" max="8" required>
        <input type="text" id="tt-subject" placeholder="Przedmiot (np. Matematyka)" required>
        <button type="submit" class="btn">Dodaj do planu</button>
      </form>
    </div>
  `;

  // Obsluga dodawania klasy
  document.getElementById('form-add-class').addEventListener('submit', async (e) => {
    e.preventDefault();
    await addDoc(collection(db, "classes"), { name: document.getElementById('class-name').value, schoolId: currentUserData.schoolId || "school1" });
    alert('Klasa zostala dodana!');
    loadView('admin-setup');
  });

  // Obsluga przypisywania ucznia do klasy
  document.getElementById('form-assign-student').addEventListener('submit', async (e) => {
    e.preventDefault();
    const studentId = document.getElementById('as-student').value;
    const classId = document.getElementById('as-class').value;

    // Aktualizacja pola classId w dokumencie ucznia
    await setDoc(doc(db, "users", studentId), { classId: classId }, { merge: true });
    alert('Uczen zostal pomyślnie przypisany do klasy!');
  });

  // Obsluga dodawania planu
  document.getElementById('form-add-timetable').addEventListener('submit', async (e) => {
    e.preventDefault();
    await addDoc(collection(db, "timetable"), {
      classId: document.getElementById('tt-class').value,
      day: document.getElementById('tt-day').value,
      lessonNumber: Number(document.getElementById('tt-num').value),
      subject: document.getElementById('tt-subject').value
    });
    alert('Lekcja dodana do planu!');
  });
}

    // --- WIDOK DZIENNIKA LEKCYJNEGO (DLA TEACHERA I STUDENTA) ---
    async function renderJournalView(container) {
      let classes = [];
      if (currentUserData.role.includes('student')) {
        selectedClassId = currentUserData.classId || "";
      } else {
        const classesSnap = await getDocs(collection(db, "classes"));
        classesSnap.forEach(c => classes.push({ id: c.id, ...c.data() }));
        if (!selectedClassId && classes.length > 0) selectedClassId = classes[0].id;
      }

      let classSelectHtml = '';
      if (!currentUserData.role.includes('student')) {
        classSelectHtml = `
          <div class="form-group" style="max-width: 300px;">
            <label>Wybierz klase:</label>
            <select id="select-class">
              ${classes.map(c => `<option value="${c.id}" ${c.id === selectedClassId ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
        `;
      }

      let html = `
        <div class="card">
          ${classSelectHtml}
          <h3>Kalendarz Tygodniowy</h3>
          <div class="week-calendar">
            ${daysOfWeek.map(d => `
              <div class="day-card ${d === selectedDay ? 'active' : ''}" data-day="${d}">
                <strong>${d}</strong>
              </div>
            `).join('')}
          </div>
        </div>
        <div id="lessons-container"></div>
      `;

      container.innerHTML = html;

      if (document.getElementById('select-class')) {
        document.getElementById('select-class').addEventListener('change', (e) => {
          selectedClassId = e.target.value;
          renderLessonsList();
        });
      }

      container.querySelectorAll('.day-card').forEach(card => {
        card.addEventListener('click', () => {
          container.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          selectedDay = card.dataset.day;
          renderLessonsList();
        });
      });

      renderLessonsList();
    }

    // LISTA LEKCJI W DANYM DNIU
    async function renderLessonsList() {
      const container = document.getElementById('lessons-container');
      container.innerHTML = '<p>Ladowanie planu lekcji...</p>';

      if (!selectedClassId) {
        container.innerHTML = '<div class="card"><p>Brak przypisanej klasy.</p></div>';
        return;
      }

      const q = query(
        collection(db, "timetable"),
        where("classId", "==", selectedClassId),
        where("day", "==", selectedDay)
      );
      const ttSnap = await getDocs(q);

      let lessons = [];
      ttSnap.forEach(doc => lessons.push({ id: doc.id, ...doc.data() }));
      lessons.sort((a, b) => a.lessonNumber - b.lessonNumber);

      if (lessons.length === 0) {
        container.innerHTML = `<div class="card"><p>Brak lekcji w planie na dzien: ${selectedDay}</p></div>`;
        return;
      }

      let html = `<div class="card"><h3>Lekcje w dniu: ${selectedDay}</h3><div class="lesson-list">`;
      lessons.forEach(l => {
        html += `
          <div class="lesson-item" data-id="${l.id}" data-subject="${l.subject}">
            <div>
              <strong>Lekcja ${l.lessonNumber}: ${l.subject}</strong>
            </div>
            <button class="btn" style="width: auto;">Otworz dziennik lekcji</button>
          </div>
        `;
      });
      html += `</div></div><div id="lesson-details"></div>`;
      container.innerHTML = html;

      container.querySelectorAll('.lesson-item').forEach(item => {
        item.addEventListener('click', () => {
          selectedLesson = { id: item.dataset.id, subject: item.dataset.subject };
          renderLessonDetails(selectedLesson);
        });
      });
    }

    // PANEL KLIKNIĘTEJ LEKCJI (FREKWENCJA, OCENY, UWAGI, TERMINARZ)
    async function renderLessonDetails(lesson) {
      const container = document.getElementById('lesson-details');
      const isTeacher = currentUserData.role.includes('teacher') || currentUserData.role.includes('admin');

      container.innerHTML = `
        <div class="card" style="border-top: 4px solid var(--role-current);">
          <h3>Szczegoly Lekcji: ${lesson.subject} (${selectedDay})</h3>
          <div class="lesson-tabs">
            <button class="tab-btn active" data-tab="tab-attendance">Frekwencja</button>
            <button class="tab-btn" data-tab="tab-grades">Oceny</button>
            <button class="tab-btn" data-tab="tab-remarks">Uwagi</button>
            <button class="tab-btn" data-tab="tab-schedule">Terminarz</button>
          </div>
          <div id="tab-content"></div>
        </div>
      `;

      container.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadTabContent(btn.dataset.tab, lesson, isTeacher);
        });
      });

      loadTabContent('tab-attendance', lesson, isTeacher);
    }

    async function loadTabContent(tabName, lesson, isTeacher) {
      const tabContainer = document.getElementById('tab-content');
      tabContainer.innerHTML = '<p>Ladowanie modułu...</p>';

      // --- TAB 1: FREKWENCJA ---
      if (tabName === 'tab-attendance') {
        if (isTeacher) {
          const studentsSnap = await getDocs(query(collection(db, "users"), where("classId", "==", selectedClassId), where("role", "==", "student")));
          let html = `<h4>Sprawdzanie obecnosci</h4><table><thead><tr><th>Uczen</th><th>Status</th></tr></thead><tbody>`;
          studentsSnap.forEach(s => {
            html += `
              <tr>
                <td>${s.data().name} ${s.data().surname}</td>
                <td>
                  <select class="att-select" data-student="${s.id}">
                    <option value="Obecny">Obecny</option>
                    <option value="Nieobecny">Nieobecny</option>
                    <option value="Spozniony">Spozniony</option>
                  </select>
                </td>
              </tr>
            `;
          });
          html += `</tbody></table><button id="save-att" class="btn" style="margin-top:15px;">Zapisz frekwencje</button>`;
          tabContainer.innerHTML = html;

          document.getElementById('save-att')?.addEventListener('click', async () => {
            const selects = tabContainer.querySelectorAll('.att-select');
            for (let sel of selects) {
              await addDoc(collection(db, "attendance"), {
                studentId: sel.dataset.student,
                lessonId: lesson.id,
                day: selectedDay,
                status: sel.value,
                date: new Date().toISOString().split('T')[0]
              });
            }
            alert('Frekwencja zapisana!');
          });
        } else {
          const attSnap = await getDocs(query(collection(db, "attendance"), where("studentId", "==", currentUserData.uid), where("lessonId", "==", lesson.id)));
          let html = `<h4>Moja frekwencja na tej lekcji</h4><table><thead><tr><th>Data</th><th>Status</th></tr></thead><tbody>`;
          attSnap.forEach(a => { html += `<tr><td>${a.data().date}</td><td>${a.data().status}</td></tr>`; });
          html += `</tbody></table>`;
          tabContainer.innerHTML = html;
        }
      }

      // --- TAB 2: OCENY ---
      else if (tabName === 'tab-grades') {
        if (isTeacher) {
          const studentsSnap = await getDocs(query(collection(db, "users"), where("classId", "==", selectedClassId), where("role", "==", "student")));
          let studentOpts = '';
          studentsSnap.forEach(s => studentOpts += `<option value="${s.id}">${s.data().name} ${s.data().surname}</option>`);

          tabContainer.innerHTML = `
            <form id="form-add-grade" class="form-inline">
              <select id="g-student" required>${studentOpts}</select>
              <select id="g-val" required>
                <option value="6">6</option><option value="5">5</option><option value="4">4</option>
                <option value="3">3</option><option value="2">2</option><option value="1">1</option>
              </select>
              <input type="text" id="g-desc" placeholder="Krotki opis" required>
              <button type="submit" class="btn">Wstaw ocene</button>
            </form>
          `;

          document.getElementById('form-add-grade').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "grades"), {
              studentId: document.getElementById('g-student').value,
              subject: lesson.subject,
              value: Number(document.getElementById('g-val').value),
              description: document.getElementById('g-desc').value,
              date: new Date().toISOString().split('T')[0]
            });
            alert('Ocena wstawiona!');
          });
        } else {
          const gradesSnap = await getDocs(query(collection(db, "grades"), where("studentId", "==", currentUserData.uid), where("subject", "==", lesson.subject)));
          let html = `<h4>Moje oceny z: ${lesson.subject}</h4><table><thead><tr><th>Ocena</th><th>Opis</th><th>Data</th></tr></thead><tbody>`;
          gradesSnap.forEach(g => { html += `<tr><td><strong>${g.data().value}</strong></td><td>${g.data().description}</td><td>${g.data().date}</td></tr>`; });
          html += `</tbody></table>`;
          tabContainer.innerHTML = html;
        }
      }

      // --- TAB 3: UWAGI ---
      else if (tabName === 'tab-remarks') {
        if (isTeacher) {
          const studentsSnap = await getDocs(query(collection(db, "users"), where("classId", "==", selectedClassId), where("role", "==", "student")));
          let studentOpts = '';
          studentsSnap.forEach(s => studentOpts += `<option value="${s.id}">${s.data().name} ${s.data().surname}</option>`);

          tabContainer.innerHTML = `
            <form id="form-add-remark">
              <div class="form-group"><label>Uczen</label><select id="r-student">${studentOpts}</select></div>
              <div class="form-group"><label>Tresc uwagi</label><textarea id="r-text" required></textarea></div>
              <button type="submit" class="btn">Wpisz uwage</button>
            </form>
          `;

          document.getElementById('form-add-remark').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "remarks"), {
              studentId: document.getElementById('r-student').value,
              text: document.getElementById('r-text').value,
              teacherName: `${currentUserData.name} ${currentUserData.surname}`,
              date: new Date().toISOString().split('T')[0]
            });
            alert('Uwaga dodana!');
          });
        } else {
          const remarksSnap = await getDocs(query(collection(db, "remarks"), where("studentId", "==", currentUserData.uid)));
          let html = `<h4>Moje uwagi</h4>`;
          remarksSnap.forEach(r => { html += `<p><strong>${r.data().date}:</strong> ${r.data().text}</p>`; });
          tabContainer.innerHTML = html;
        }
      }

      // --- TAB 4: TERMINARZ ---
      else if (tabName === 'tab-schedule') {
        if (isTeacher) {
          tabContainer.innerHTML = `
            <form id="form-add-event" class="form-inline">
              <input type="text" id="ev-title" placeholder="Tytul (np. Sprawdzian)" required>
              <input type="date" id="ev-date" required>
              <button type="submit" class="btn">Dodaj wpis do terminarza</button>
            </form>
          `;

          document.getElementById('form-add-event').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "schedule"), {
              classId: selectedClassId,
              subject: lesson.subject,
              title: document.getElementById('ev-title').value,
              eventDate: document.getElementById('ev-date').value
            });
            alert('Termin zapisany!');
          });
        } else {
          const evSnap = await getDocs(query(collection(db, "schedule"), where("classId", "==", selectedClassId), where("subject", "==", lesson.subject)));
          let html = `<h4>Wpisane sprawdziany i zadania</h4><table><thead><tr><th>Tytul</th><th>Data</th></tr></thead><tbody>`;
          evSnap.forEach(ev => { html += `<tr><td>${ev.data().title}</td><td>${ev.data().eventDate}</td></tr>`; });
          html += `</tbody></table>`;
          tabContainer.innerHTML = html;
        }
      }
    }

    async function renderAnnouncements(container) {
      const annSnap = await getDocs(collection(db, "announcements"));
      let html = `<div class="card"><h3>Ogloszenia Szkolne</h3>`;
      annSnap.forEach(a => {
        html += `<div style="border-bottom: 1px solid #ccc; padding: 10px 0;"><h4>${a.data().title}</h4><p>${a.data().text}</p></div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
